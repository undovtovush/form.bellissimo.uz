<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>404 — Page Not Found</title>
  <style>
    /* ========== RESET ========== */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #02030a;
      color: #f2f6ff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
      isolation: isolate;
      min-height: 100dvh;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ========== LIVE GRADIENT BACKGROUND ========== */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -3;
      background:
        radial-gradient(ellipse 80% 60% at 15% 15%, rgba(90, 130, 255, 0.45), transparent 60%),
        radial-gradient(ellipse 70% 55% at 85% 85%, rgba(200, 90, 255, 0.4), transparent 60%),
        radial-gradient(ellipse 60% 60% at 50% 50%, rgba(0, 220, 255, 0.18), transparent 70%),
        linear-gradient(160deg, #060818 0%, #0a0f24 50%, #05060f 100%);
      background-size: 200% 200%, 200% 200%, 200% 200%, 100% 100%;
      animation: bgShift 22s ease-in-out infinite alternate;
    }

    @keyframes bgShift {
      0%   { background-position: 0% 0%, 100% 100%, 50% 50%, 0 0; }
      50%  { background-position: 100% 50%, 0% 40%, 40% 60%, 0 0; }
      100% { background-position: 50% 100%, 50% 0%, 60% 30%, 0 0; }
    }

    /* ========== BLUR ORBS (animated) ========== */
    .orbs {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      filter: blur(80px);
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      opacity: 0.75;
      will-change: transform;
    }

    .orb-1 {
      width: 45vmax;
      height: 45vmax;
      background: radial-gradient(circle, #3b6fff 0%, transparent 70%);
      top: -20vmax;
      left: -15vmax;
      animation: floatOrb1 16s ease-in-out infinite alternate;
    }

    .orb-2 {
      width: 40vmax;
      height: 40vmax;
      background: radial-gradient(circle, #b84dff 0%, transparent 70%);
      bottom: -18vmax;
      right: -12vmax;
      animation: floatOrb2 20s ease-in-out infinite alternate;
    }

    .orb-3 {
      width: 32vmax;
      height: 32vmax;
      background: radial-gradient(circle, #00e5ff 0%, transparent 70%);
      top: 40%;
      left: 55%;
      opacity: 0.5;
      animation: floatOrb3 24s ease-in-out infinite alternate;
    }

    @keyframes floatOrb1 {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(10vmax, 8vmax) scale(1.2); }
    }
    @keyframes floatOrb2 {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-12vmax, -6vmax) scale(1.15); }
    }
    @keyframes floatOrb3 {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-8vmax, 10vmax) scale(0.9); }
    }

    /* ========== SHIMMERING STARS ========== */
    .stars {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }

    .star {
      position: absolute;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 6px 1px rgba(160, 200, 255, 0.9);
      animation: twinkle ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.15; transform: scale(0.8); }
      50%      { opacity: 1;    transform: scale(1.3); }
    }

    /* ========== GLASS CARD ========== */
    .error-card {
      position: relative;
      width: 100%;
      max-width: 820px;
      padding: clamp(2rem, 7vw, 4.5rem) clamp(1.25rem, 6vw, 4rem);
      text-align: center;
      border-radius: 2.75rem;
      /* super transparent glass */
      background: linear-gradient(
        155deg,
        rgba(255, 255, 255, 0.11) 0%,
        rgba(255, 255, 255, 0.03) 45%,
        rgba(255, 255, 255, 0.06) 100%
      );
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow:
        0 30px 70px -25px rgba(0, 0, 0, 0.75),
        0 0 0 1px rgba(255, 255, 255, 0.06) inset,
        0 0 80px -20px rgba(100, 150, 255, 0.45);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      overflow: hidden;
      transform: translateY(40px) scale(0.97);
      opacity: 0;
      animation: cardIn 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
    }

    @keyframes cardIn {
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* top highlight on glass */
    .error-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
      pointer-events: none;
    }

    /* rotating conic glow border */
    .error-card::after {
      content: '';
      position: absolute;
      inset: -1.5px;
      border-radius: inherit;
      padding: 1.5px;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        rgba(90, 160, 255, 0.9) 70deg,
        rgba(200, 120, 255, 0.9) 150deg,
        rgba(0, 220, 255, 0.7) 230deg,
        transparent 320deg
      );
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: spinGlow 7s linear infinite;
      opacity: 0.85;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes spinGlow {
      to { transform: rotate(360deg); }
    }

    /* ========== 404 DIGITS ========== */
    .error-code {
      font-size: clamp(7rem, 33vw, 13.5rem);
      font-weight: 900;
      line-height: 0.88;
      letter-spacing: -0.05em;
      margin-bottom: 0.15em;
      display: flex;
      justify-content: center;
      gap: 0.02em;
      perspective: 1000px;
      position: relative;
      z-index: 2;
    }

    .digit {
      display: inline-block;
      background: linear-gradient(
        180deg,
        #ffffff 0%,
        #a8d0ff 35%,
        #7f9eff 65%,
        #c58cff 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter:
        drop-shadow(0 0 25px rgba(120, 170, 255, 0.7))
        drop-shadow(0 0 60px rgba(180, 120, 255, 0.45));
      transform: translateY(60px) rotateX(70deg) scale(0.8);
      opacity: 0;
      animation: digitPop 1s cubic-bezier(0.16, 1, 0.3, 1) forwards,
                 digitFloat 4.5s ease-in-out infinite;
      will-change: transform;
    }

    .digit:nth-child(1) { animation-delay: 0.25s, 1.3s; }
    .digit:nth-child(2) { animation-delay: 0.42s, 1.45s; }
    .digit:nth-child(3) { animation-delay: 0.59s, 1.6s; }

    @keyframes digitPop {
      to { transform: translateY(0) rotateX(0) scale(1); opacity: 1; }
    }

    @keyframes digitFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }

    /* ========== TITLE ========== */
    .error-title {
      position: relative;
      z-index: 2;
      font-size: clamp(1.7rem, 5.5vw, 2.6rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.6rem;
      background: linear-gradient(180deg, #ffffff 30%, #b9cdf5 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.4));
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s ease 0.75s forwards;
    }

    /* ========== DESCRIPTION ========== */
    .error-description {
      position: relative;
      z-index: 2;
      font-size: clamp(1rem, 3.4vw, 1.2rem);
      color: rgba(220, 230, 255, 0.75);
      max-width: 42ch;
      margin: 0 auto 2.2rem;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s ease 0.9s forwards;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ========== BUTTONS ========== */
    .button-group {
      position: relative;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s ease 1.05s forwards;
    }

    .btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      padding: 0.9rem 2.1rem;
      border-radius: 100px;
      font-size: clamp(0.95rem, 2.8vw, 1.05rem);
      font-weight: 600;
      letter-spacing: 0.01em;
      text-decoration: none;
      cursor: pointer;
      border: none;
      overflow: hidden;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.3s ease,
                  background 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn svg {
      width: 19px;
      height: 19px;
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    /* PRIMARY — bright glass gradient */
    .btn-primary {
      color: #ffffff;
      background: linear-gradient(135deg,
        rgba(100, 160, 255, 0.95) 0%,
        rgba(160, 100, 255, 0.95) 100%);
      box-shadow:
        0 14px 32px -10px rgba(120, 150, 255, 0.7),
        0 0 0 1px rgba(255, 255, 255, 0.18) inset,
        0 0 30px -5px rgba(140, 120, 255, 0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .btn-primary::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        120deg,
        transparent 20%,
        rgba(255, 255, 255, 0.45) 50%,
        transparent 80%
      );
      transform: translateX(-130%);
      transition: transform 0.75s ease;
    }

    .btn-primary:hover::before,
    .btn-primary:focus-visible::before {
      transform: translateX(130%);
    }

    .btn-primary:hover,
    .btn-primary:focus-visible {
      transform: translateY(-3px) scale(1.04);
      box-shadow:
        0 24px 44px -12px rgba(140, 170, 255, 0.85),
        0 0 0 1px rgba(255, 255, 255, 0.25) inset,
        0 0 45px -5px rgba(160, 130, 255, 0.7);
      outline: none;
    }

    .btn-primary:hover svg { transform: translateX(-3px); }
    .btn-primary:active { transform: translateY(0) scale(0.98); }

    /* SECONDARY — glass ghost */
    .btn-secondary {
      color: #e6efff;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow:
        0 10px 24px -12px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.04) inset;
    }

    .btn-secondary:hover,
    .btn-secondary:focus-visible {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-3px) scale(1.04);
      box-shadow:
        0 20px 34px -14px rgba(0, 0, 0, 0.7),
        0 0 30px -5px rgba(150, 190, 255, 0.35);
      outline: none;
      color: #ffffff;
    }

    .btn-secondary:hover svg { transform: translateX(-3px); }
    .btn-secondary:active { transform: translateY(0) scale(0.98); }

    /* ripple */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      transform: scale(0);
      animation: rippleAnim 0.7s ease-out;
      pointer-events: none;
    }

    @keyframes rippleAnim {
      to { transform: scale(4); opacity: 0; }
    }

    /* ========== HINT ========== */
    .hint {
      position: relative;
      z-index: 2;
      margin-top: 2.3rem;
      font-size: 0.85rem;
      color: rgba(180, 200, 235, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeUp 0.8s ease 1.25s forwards;
    }

    .hint svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: pulseIcon 2.4s ease-in-out infinite;
    }

    @keyframes pulseIcon {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50%      { opacity: 1;   transform: scale(1.15); }
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 520px) {
      body { padding: 1rem; }

      .error-card {
        border-radius: 1.9rem;
        padding: 2.5rem 1.2rem;
      }

      .button-group { gap: 0.75rem; }

      .btn {
        width: 100%;
        max-width: 280px;
        padding: 0.85rem 1.5rem;
        margin: 0 auto;
      }
    }

    @media (max-height: 640px) {
      .error-card { padding-top: 1.75rem; padding-bottom: 1.75rem; }
      .error-description { margin-bottom: 1.4rem; }
      .hint { margin-top: 1.4rem; }
    }

    /* accessibility: reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
      .digit, .error-title, .error-description, .button-group,
      .hint, .error-card {
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- live gradient background -->
  <div class="bg" aria-hidden="true"></div>

  <!-- blur orbs -->
  <div class="orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- twinkling stars -->
  <div class="stars" id="stars" aria-hidden="true"></div>

  <!-- main glass card -->
  <main class="error-card" role="main">
    <div class="error-code" aria-label="Error 404">
      <span class="digit" data-depth="1">4</span>
      <span class="digit" data-depth="2">0</span>
      <span class="digit" data-depth="3">4</span>
    </div>

    <h1 class="error-title">Page not found</h1>

    <p class="error-description">
      The page you're looking for doesn't exist, has been removed, or the URL might be incorrect.
    </p>

    <div class="button-group">
      <a href="/" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Go Home
      </a>

      <a href="javascript:history.back()" class="btn btn-secondary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        Go Back
      </a>
    </div>

    <div class="hint">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span>Check the URL or try again later.</span>
    </div>
  </main>

  <script>
    (function () {
      "use strict";

      /* ========== STARS ========== */
      const starsContainer = document.getElementById('stars');
      const STAR_COUNT = window.innerWidth < 600 ? 40 : 80;

      function createStars() {
        const frag = document.createDocumentFragment();
        for (let i = 0; i < STAR_COUNT; i++) {
          const s = document.createElement('span');
          s.className = 'star';
          const size = Math.random() * 2 + 1;
          const left = Math.random() * 100;
          const top = Math.random() * 100;
          const dur = Math.random() * 4 + 2.5;
          const delay = Math.random() * 5;

          s.style.width = size + 'px';
          s.style.height = size + 'px';
          s.style.left = left + 'vw';
          s.style.top = top + 'vh';
          s.style.animationDuration = dur + 's';
          s.style.animationDelay = delay + 's';

          frag.appendChild(s);
        }
        starsContainer.appendChild(frag);
      }

      createStars();

      /* ========== RIPPLE ON BUTTONS ========== */
      document.querySelectorAll('.btn').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          const rect = btn.getBoundingClientRect();
          const size = Math.max(rect.width, rect.height);
          const ripple = document.createElement('span');
          ripple.className = 'ripple';
          ripple.style.width = ripple.style.height = size + 'px';
          ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
          ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
          btn.appendChild(ripple);
          setTimeout(function () { ripple.remove(); }, 750);
        });
      });

      /* ========== 3D TILT ON CARD ========== */
      const card = document.querySelector('.error-card');
      const isTouch = window.matchMedia('(hover: none)').matches;

      if (!isTouch && window.innerWidth > 720) {
        card.addEventListener('mousemove', function (e) {
          const rect = card.getBoundingClientRect();
          const x = (e.clientX - rect.left) / rect.width - 0.5;
          const y = (e.clientY - rect.top) / rect.height - 0.5;
          const rotX = (-y * 7).toFixed(2);
          const rotY = (x * 7).toFixed(2);
          card.style.transform =
            'perspective(1300px) rotateX(' + rotX + 'deg) rotateY(' + rotY + 'deg)';
        });

        card.addEventListener('mouseleave', function () {
          card.style.transform = 'perspective(1300px) rotateX(0) rotateY(0)';
        });
      }

      /* ========== DIGIT PARALLAX ON MOUSE MOVE ========== */
      if (!isTouch) {
        const digits = document.querySelectorAll('.digit');
        window.addEventListener('mousemove', function (e) {
          const cx = (e.clientX / window.innerWidth - 0.5) * 2;
          const cy = (e.clientY / window.innerHeight - 0.5) * 2;

          digits.forEach(function (d) {
            const depth = parseInt(d.dataset.depth || 1, 10) * 4;
            d.style.translate = (cx * depth) + 'px ' + (cy * depth) + 'px';
          });
        });
      }

      /* ========== RESIZE HANDLER ========== */
      let resizeTimer;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
          const expected = window.innerWidth < 600 ? 40 : 80;
          if (starsContainer.children.length !== expected) {
            starsContainer.innerHTML = '';
            createStars();
          }
        }, 400);
      });
    })();
  </script>
</body>
</html>
